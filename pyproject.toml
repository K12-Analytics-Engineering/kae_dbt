[project]
name = "kae-dbt"
version = "0.6.2"
description = "KAE utilities for dbt"
readme = "README.md"
authors = [
  {name = "Marcos Alcozer", email = "marcos@alcozer.dev"},
  {name = "Zander Stachniak", email = "zander@alcozer.dev"},
]
maintainers = [
  {name = "K12 Analytics Engineering", email = "team@alcozer.dev"}
]
dependencies = [
    "dbt-core==1.11.12",
    "dbt-bigquery==1.11.3",
]
packages = [{include = "kae_dbt"}]
requires-python = "~=3.13.0"

[dependency-groups]
dev = [
    "sqlfluff~=3.4",
    "sqlfluff-templater-dbt~=3.4",
    "ruff~=0.12",
    "pre-commit~=4.2",
]

[tool.uv]
constraint-dependencies = [
    # dbt-labs family — exact pins, identical fleet-wide (update-dbt-stack skill)
    "dbt-adapters==1.24.2",
    "dbt-common==1.38.0",
    "dbt-semantic-interfaces==0.9.0",
    "dbt-extractor==0.6.0",
    "dbt-protos==1.0.514",
    "metricflow==0.211.0",
]
